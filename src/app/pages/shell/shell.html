<div class="frame">
  <header>
    <a class="wordmark" routerLink="/">CURBSIDE</a>
    <nav aria-label="Account">
      <a
        class="btn-text"
        routerLink="/"
        routerLinkActive="current"
        [routerLinkActiveOptions]="{ exact: true }"
        ariaCurrentWhenActive="page"
        >Street</a
      >
      <a
        class="btn-text"
        routerLink="/activity"
        routerLinkActive="current"
        ariaCurrentWhenActive="page"
        >Activity
        @if (activity.unread(); as n) {
          <span class="badge" aria-hidden="true">{{ n > 9 ? '9+' : n }}</span>
          <span class="sr-only">, {{ n }} new</span>
        }
      </a>
      <a
        class="btn-text"
        routerLink="/profile"
        routerLinkActive="current"
        ariaCurrentWhenActive="page"
        >Profile</a
      >
      @if (store.account()?.is_admin) {
        <a
          class="btn-text"
          routerLink="/admin"
          routerLinkActive="current"
          ariaCurrentWhenActive="page"
          >Admin</a
        >
      }
    </nav>
  </header>

  @switch (store.status()) {
    @case ('ready') {
      <router-outlet />
    }
    @case ('failed') {
      <main class="page">
        <p class="notice" role="alert">Couldn't reach Curbside.</p>
        <button class="btn" type="button" (click)="store.load()">Try again</button>
      </main>
    }
    @default {
      <xom-loading label="Opening your street" />
    }
  }
</div>
