<div class="frame">
  <header>
    <a class="wordmark" routerLink="/">CURBSIDE</a>
    <nav aria-label="Account">
      <a
        class="btn-text"
        routerLink="/"
        routerLinkActive="current"
        [routerLinkActiveOptions]="{ exact: true }"
        ariaCurrentWhenActive="page"
        >Street</a
      >
      <a
        class="btn-text"
        routerLink="/profile"
        routerLinkActive="current"
        ariaCurrentWhenActive="page"
        >Profile</a
      >
    </nav>
  </header>

  @switch (store.status()) {
    @case ('ready') {
      <router-outlet />
    }
    @case ('failed') {
      <main class="page">
        <p class="notice" role="alert">Couldn't reach Curbside.</p>
        <button class="btn" type="button" (click)="store.load()">Try again</button>
      </main>
    }
    @default {
      <xom-loading label="Opening your street" />
    }
  }
</div>
